name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  servidor:
    runs-on: ubuntu-latest

    services:
      postgres:
        # La misma imagen que producción: media arquitectura vive en
        # constraints, triggers y columnas generadas que solo existen aquí.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: dsd_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DSD_TEST_DATABASE_URL: postgresql+psycopg://postgres:pruebas@127.0.0.1:5432/dsd_test
      DSD_JWT_SECRETO: secreto-de-ci-de-32-bytes-o-mas-no-usar-en-produccion

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: server
        run: uv pip install --system -e '.[dev]'

      - name: Lint
        working-directory: server
        run: ruff check app tests

      - name: Pruebas
        working-directory: server
        run: pytest -q

      # --------------------------------------------------------------------
      # Los contratos entre Dart y Python
      # --------------------------------------------------------------------
      - name: Los vectores canónicos están al día
        run: |
          python3 contracts/generar_vectores.py
          git diff --exit-code contracts/canonical_vectors.json || {
            echo "::error::Los vectores canónicos cambiaron y no se versionó el archivo."
            echo "Si el cambio es intencional, corre contracts/generar_vectores.py,"
            echo "REVISA EL DIFF, y actualiza el cliente Dart en el MISMO commit."
            exit 1
          }

      - name: El contrato OpenAPI está al día
        working-directory: server
        run: |
          python3 ../contracts/exportar_openapi.py
          cd .. && git diff --exit-code contracts/openapi.json contracts/openapi-3.0.json || {
            echo "::error::El contrato HTTP cambió. Regenera el cliente Dart."
            exit 1
          }
