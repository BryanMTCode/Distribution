name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  servidor:
    runs-on: ubuntu-latest

    services:
      postgres:
        # La misma imagen que producción: media arquitectura vive en
        # constraints, triggers y columnas generadas que solo existen aquí.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: dsd_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DSD_TEST_DATABASE_URL: postgresql+psycopg://postgres:pruebas@127.0.0.1:5432/dsd_test
      DSD_JWT_SECRETO: secreto-de-ci-de-32-bytes-o-mas-no-usar-en-produccion

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Un venv en server/.venv, igual que en local (ver Makefile). Con
      # --system, uv apunta al intérprete del runner, que está "externally
      # managed" y rechaza la instalación.
      - name: Instalar dependencias
        working-directory: server
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'

      - name: Lint
        working-directory: server
        run: .venv/bin/ruff check app tests

      - name: Pruebas
        working-directory: server
        run: .venv/bin/python -m pytest -q

      # --------------------------------------------------------------------
      # Los contratos entre Dart y Python
      # --------------------------------------------------------------------
      - name: Los vectores canónicos están al día
        run: |
          server/.venv/bin/python contracts/generar_vectores.py
          git diff --exit-code contracts/canonical_vectors.json || {
            echo "::error::Los vectores canónicos cambiaron y no se versionó el archivo."
            echo "Si el cambio es intencional, corre contracts/generar_vectores.py,"
            echo "REVISA EL DIFF, y actualiza el cliente Dart en el MISMO commit."
            exit 1
          }

      - name: El fixture de deltas está al día
        working-directory: server
        run: |
          .venv/bin/python -m pytest tests/test_contrato_deltas.py -q
          cd .. && git diff --exit-code contracts/deltas_de_ejemplo.json || {
            echo "::error::La forma de los deltas cambió."
            echo "Revisa el diff y confirma que contrato_deltas_test.dart sigue verde:"
            echo "  cd mobile/packages/dsd_core && dart test test/contrato_deltas_test.dart"
            exit 1
          }

      - name: El contrato de importes está al día
        run: |
          server/.venv/bin/python contracts/generar_importes.py
          git diff --exit-code contracts/importes_de_ejemplo.json || {
            echo "::error::La aritmética de una partida cambió."
            echo "El importe de una línea se calcula en TRES lugares: el teléfono,"
            echo "el servidor y el CHECK de PostgreSQL. Revisa el diff y confirma"
            echo "que los tres siguen dando el mismo centavo:"
            echo "  cd mobile/packages/dsd_core && dart test test/importes_contrato_test.dart"
            echo "  cd server && .venv/bin/python -m pytest tests/test_importes.py"
            exit 1
          }

      - name: El contrato OpenAPI está al día
        working-directory: server
        run: |
          .venv/bin/python ../contracts/exportar_openapi.py
          cd .. && git diff --exit-code contracts/openapi.json contracts/openapi-3.0.json || {
            echo "::error::El contrato HTTP cambió. Regenera el cliente Dart."
            exit 1
          }

  movil:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/packages/dsd_core

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - name: Análisis estático
        run: dart analyze

      - name: Pruebas
        run: dart test

      # --------------------------------------------------------------------
      # La otra mitad de los contratos
      # --------------------------------------------------------------------
      # `dart test` ya corrió los vectores canónicos: si Dart y Python
      # divergieran, este job se pone rojo y el de Python no. Esa asimetría es
      # justo la señal que se busca.
      - name: Los sobres de ejemplo están al día
        run: |
          dart run tool/generar_sobres_ejemplo.dart
          cd ../../.. && git diff --exit-code contracts/sobres_de_ejemplo.json || {
            echo "::error::Los sobres que genera el cliente Dart cambiaron."
            echo "Regenéralos, REVISA EL DIFF, y confirma que"
            echo "server/tests/test_contrato_dart.py sigue en verde."
            exit 1
          }

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      # Las pruebas de widget corren sin emulador, en el Dart VM. Ejercen la
      # pantalla real: login offline contra un hash Argon2id del servidor, y la
      # lista de clientes con el crédito compuesto desde SQLite.
      - name: Pruebas de widget
        run: flutter test

      # El modo demo es un atajo que salta el login; el candado que impide que
      # llegue a producción es de compilación (ver lib/src/demo.dart). El paso
      # de arriba, sin define, es el que comprueba que el atajo está apagado en
      # la compilación normal —la que se instala en el teléfono del vendedor—.
      # Este ejercita el camino contrario: que el atajo, cuando se pide, de
      # verdad siembre y entre. Sin este paso el modo demo se podría podrir sin
      # que nadie lo notara hasta estar en la calle con el teléfono en la mano.
      - name: Pruebas de widget en modo demo
        run: flutter test --dart-define=DSD_DEMO=true

      - name: El esquema local embebido está al día
        working-directory: mobile/packages/dsd_core
        run: |
          flutter pub get
          dart run tool/generar_esquema.dart
          cd ../../.. && git diff --exit-code mobile/packages/dsd_core/lib/src/esquema_local.dart || {
            echo "::error::Se editó mobile/db/schema.sql sin regenerar la constante."
            echo "La app en el teléfono crearía un esquema distinto al que se prueba."
            exit 1
          }
