[project]
name = "dsd-server"
version = "0.1.0"
description = "Sistema DSD — API, panel de operación y workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",
    "uuid6>=2024.7.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "hypothesis>=6.122",
    "ruff>=0.8",
]

# El laboratorio analítico (Fase 8). Va en `dev` y no en un venv aparte porque
# `make instalar` tiene que dejar TODO funcionando: un segundo entorno que hay
# que acordarse de crear es un paso más que se olvida, y entonces `make analitica`
# falla con un ModuleNotFoundError que no dice qué hacer.
#
# En producción no se instalan aquí: el laboratorio corre en su propio contenedor
# con `analytics/requirements.txt`, sin FastAPI ni SQLAlchemy.
analitica = [
    "streamlit>=1.64",
    "pandas>=2.2",
]

# Sentry (Fase 9). Extra aparte y NO incluido en `dev` a propósito: manda los
# errores a un servidor de un tercero, y eso es una decisión que se toma al
# desplegar, no algo que venga instalado porque sí.
#
# Sin `DSD_SENTRY_DSN` el módulo no lo importa, así que una instalación sin este
# extra funciona igual — `app/core/observabilidad.py` lo avisa en el log si el
# DSN está puesto y el paquete falta, en vez de no arrancar.
observabilidad = [
    "sentry-sdk>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
