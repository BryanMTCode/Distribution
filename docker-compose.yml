# Despliegue del servidor local (mini PC en la oficina).
#
# Recordatorios que no son opcionales (ver docs/ARQUITECTURA.md §1.4):
#   · UPS / no-break: un apagón con 8 rutas sincronizando corrompe la BD.
#   · Simulacro de restauración: un respaldo que nunca restauraste no lo es.
#   · Failover 4G en el router.
#   · ZONA HORARIA. Todos los servicios van en la hora de la operación, no en
#     UTC. La operación es en MAZATLÁN (America/Mazatlan, UTC−7 todo el año, una
#     hora detrás de la Ciudad de México): «hoy» es el día de quien vende, no el
#     de quien usa el panel. Y la API se la pide a PostgreSQL en cada conexión
#     (core/db.py), porque la del volumen se fijó el día que se creó. `CURRENT_DATE` y `date.today()` deciden qué es "hoy", y en UTC−6 un
#     reloj en UTC hace que a partir de las 18:00 locales "hoy" sea ya mañana:
#     el tablero del día sale vacío por la tarde y el arqueo de la liquidación
#     no cuadra con el efectivo que la gente tiene en la mano. El síntoma
#     desconcierta porque a las 11 de la mañana todo funciona.

name: dsd

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsd
      POSTGRES_USER: ${DSD_DB_USUARIO:-dsd}
      POSTGRES_PASSWORD: ${DSD_DB_PASSWORD:?define DSD_DB_PASSWORD en .env}
      TZ: ${DSD_ZONA:-America/Mazatlan}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DSD_DB_USUARIO:-dsd} -d dsd"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin puertos publicados: solo la red interna de compose.

  migraciones:
    build: ./server
    command: alembic upgrade head
    environment:
      DSD_DATABASE_URL: postgresql+psycopg://${DSD_DB_USUARIO:-dsd}:${DSD_DB_PASSWORD}@postgres:5432/dsd
      TZ: ${DSD_ZONA:-America/Mazatlan}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Los dos roles restringidos de PostgreSQL
  # ---------------------------------------------------------------------------
  # Sin esto, `docker compose up -d` en una máquina limpia NO LEVANTA: `api` se
  # conecta como `dsd_api` y `analitica` como `dsd_analitica`, y ninguno de los
  # dos roles existe hasta que alguien aplica los scripts de `db/ops/`. Los dos
  # servicios se quedarían reiniciándose con «role does not exist» — un fallo que
  # aparece en el servidor de la oficina el día del despliegue y no antes.
  #
  # Corre DESPUÉS de las migraciones porque los GRANT son sobre tablas que las
  # migraciones crean, y se vuelve a correr en cada `up`: los dos scripts son
  # idempotentes a propósito, así que ejecutarlos siempre es lo que mantiene los
  # permisos al día cuando una migración nueva agrega tablas. El
  # `ALTER DEFAULT PRIVILEGES` cubre las futuras, pero una función nueva o un
  # GRANT que hubiera que ajustar se arregla solo si el script pasa otra vez.
  #
  # Usa la imagen de PostgreSQL, que ya trae `psql`, en vez de instalar el
  # cliente en la imagen de la aplicación.
  #
  # Y aplica los archivos de `db/ops/` TAL CUAL, montados de solo lectura: las
  # pruebas de RLS aplican esos MISMOS archivos (ADR §35), así que lo que se
  # prueba y lo que se despliega no se pueden separar.
  roles:
    image: postgis/postgis:17-3.5
    entrypoint: ["/bin/bash", "-c"]
    # Un solo elemento de lista, no una cadena: compose parte una cadena por
    # espacios, y con `entrypoint: bash -c` eso dejaría `bash -c set -e` —el
    # servicio saldría con cero habiendo hecho NADA, y `api` arrancaría contra un
    # rol que no existe. Con la lista, el script llega como un argumento.
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -v clave_api="$$DSD_CLAVE_API" -f /ops/rol_api.sql
        psql -v ON_ERROR_STOP=1 -v clave_analitica="$$DSD_CLAVE_ANALITICA" -f /ops/rol_analitico.sql
    environment:
      PGHOST: postgres
      PGUSER: ${DSD_DB_USUARIO:-dsd}
      PGPASSWORD: ${DSD_DB_PASSWORD}
      PGDATABASE: dsd
      DSD_CLAVE_API: ${DSD_CLAVE_API:?falta DSD_CLAVE_API en .env, es la clave del rol con el que la API aplica RLS}
      DSD_CLAVE_ANALITICA: ${DSD_CLAVE_ANALITICA:?falta DSD_CLAVE_ANALITICA en .env, es la clave del rol de solo lectura del laboratorio}
      TZ: ${DSD_ZONA:-America/Mazatlan}
    volumes:
      - ./server/db/ops:/ops:ro
    depends_on:
      migraciones:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: ./server
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 3
    restart: unless-stopped
    environment:
      DSD_DATABASE_URL: postgresql+psycopg://${DSD_DB_USUARIO:-dsd}:${DSD_DB_PASSWORD}@postgres:5432/dsd
      DSD_JWT_SECRETO: ${DSD_JWT_SECRETO:?genera uno con 'openssl rand -hex 32'}
      DSD_ENTORNO: produccion
      TZ: ${DSD_ZONA:-America/Mazatlan}
      # Endurecimiento (Fase 9). El rol restringido es OBLIGATORIO en
      # producción: sin él la API no arranca, porque las políticas por renglón
      # quedarían escritas y sin efecto. Se crea con db/ops/rol_api.sql.
      DSD_DATABASE_URL_API: postgresql+psycopg://dsd_api:${DSD_CLAVE_API:?falta DSD_CLAVE_API, crea el rol con db/ops/rol_api.sql}@postgres:5432/dsd
      # Vacío = /metrics no existe (404). Ponerlo solo si hay un monitor.
      DSD_METRICAS_TOKEN: ${DSD_METRICAS_TOKEN:-}
      # Vacío = Sentry apagado. Manda errores a un tercero: es una decisión.
      DSD_SENTRY_DSN: ${DSD_SENTRY_DSN:-}
      DSD_VERSION: ${DSD_VERSION:-0.1.0}
    depends_on:
      postgres:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
      roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: ./server
    command: python -m app.workers.principal
    restart: unless-stopped
    environment:
      DSD_DATABASE_URL: postgresql+psycopg://${DSD_DB_USUARIO:-dsd}:${DSD_DB_PASSWORD}@postgres:5432/dsd
      DSD_JWT_SECRETO: ${DSD_JWT_SECRETO}
      DSD_ENTORNO: produccion
      TZ: ${DSD_ZONA:-America/Mazatlan}
      # El worker NO usa el rol restringido, y es deliberado: recalcula el
      # tablero y refresca la analítica, que son agregados de TODA la operación
      # y no pertenecen a ninguna ruta. Se conecta con el rol dueño, que salta
      # las políticas por ser dueño de las tablas (ver ADR §35).
      DSD_SENTRY_DSN: ${DSD_SENTRY_DSN:-}
    depends_on:
      migraciones:
        condition: service_completed_successfully

  analitica:
    # TECHO DE MEMORIA, y es lo que hace viable un VPS de 2 GB.
    #
    # Streamlit arrastra pandas, pyarrow, numpy, altair y pydeck residentes: es el
    # proceso más gordo del stack con diferencia. Sin techo, cuando la memoria se
    # agota el OOM killer del kernel mata AL PROCESO MÁS GRANDE, que según la hora
    # puede ser PostgreSQL — y entonces una consulta exploratoria del laboratorio
    # tira la base a media venta. Con el techo, lo que muere es el laboratorio:
    # se cae la pestaña de quien estaba viendo un informe, la operación sigue.
    #
    # Si el laboratorio se reinicia solo al abrir un informe grande, es este
    # límite. Súbelo (1g) o, mejor, levanta la máquina a 4 GB.
    mem_limit: 768m
    # Contexto en la raíz: la imagen necesita `analytics/` y además el módulo de
    # definiciones `server/app/domain/analitica.py`. Ver su Dockerfile.
    build:
      context: .
      dockerfile: analytics/Dockerfile
    restart: unless-stopped
    # Rol de PostgreSQL SIN permisos de escritura: una consulta exploratoria
    # mal escrita no puede tocar la cartera. Crear con db/ops/rol_analitico.sql.
    environment:
      DSD_ANALITICA_URL: postgresql://dsd_analitica:${DSD_CLAVE_ANALITICA:?falta DSD_CLAVE_ANALITICA en .env}@postgres:5432/dsd
      TZ: ${DSD_ZONA:-America/Mazatlan}
    depends_on:
      postgres:
        condition: service_healthy
      roles:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - datos_caddy:/data
    depends_on:
      - api
      - analitica

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel: OPCIONAL, detrás de un perfil
  # ---------------------------------------------------------------------------
  # Existe para el caso de un servidor EN LA OFICINA: sin IP fija, sin abrir
  # puertos en el router, con TLS y protección DDoS incluidos.
  #
  # En un VPS no hace falta —tiene IP pública y Caddy resuelve TLS solo contra
  # Let's Encrypt—, así que va en un perfil: `docker compose up -d` NO lo
  # levanta. Antes era un servicio normal con `TUNNEL_TOKEN` marcado `:?`, y eso
  # impedía desplegar sin túnel: compose fallaba al INTERPOLAR, nombrando una
  # variable que en un VPS no tiene sentido pedir.
  #
  # Para usarlo:  docker compose --profile tunel up -d
  #
  # El token no lleva `:?` a propósito: con perfiles, compose interpola el
  # entorno de TODOS los servicios aunque no se vayan a levantar, así que
  # exigirlo volvería a romper el arranque sin túnel. Si se activa el perfil sin
  # token, cloudflared falla al instante y lo dice.
  tunel:
    profiles: ["tunel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${DSD_TUNNEL_TOKEN:-}
    depends_on:
      - caddy

volumes:
  datos_postgres:
  datos_caddy:
